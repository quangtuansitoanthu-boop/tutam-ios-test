name: Verify iOS native copying audit
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ios-copying-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TUTAM_QA_SIMULATOR_SDK_VERSION: '27.2'
      TUTAM_BUNDLE_SYNCED: '1'
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - name: Verify pinned Apple simulator toolchain
      run: |
        set -euo pipefail
        test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 27.2'
        test "$(xcodebuild -version | sed -n '2p')" = 'Build version 27B52'
        test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '27.2'
        pod --version
    - name: Install locked dependencies
      run: npm ci
    - name: Verify frozen prebuilt assets and sync only native dependencies
      run: |
        set -euo pipefail
        test ! -e .github/qa-audit-overlay.tar.gz
        node --input-type=module <<'JS'
        import fs from 'node:fs'; import path from 'node:path'; import {createHash} from 'node:crypto';
        const sha=b=>createHash('sha256').update(b).digest('hex');
        const root='ios/App/App/public', raw=fs.readFileSync(path.join(root,'mobile-assets-manifest.json'));
        if(sha(raw)!=='eb60adaaa3be0a690f993cc9bba0fa2403ddac97d385d04aebedf8bbbd86e0d6')throw Error('Frozen manifest changed');
        const manifest=JSON.parse(raw);if(manifest.version!==1||manifest.files.length!==1105)throw Error('Unexpected frozen asset count');
        for(const f of manifest.files){const b=fs.readFileSync(path.join(root,f.path));if(b.length!==f.bytes||sha(b)!==f.sha256)throw Error(f.path);}
        JS
        mkdir -p build
        cp -a ios/App/App/public/. build/
        npx cap sync ios
    - name: Isolate production hosts before native simulator UI tests
      run: |
        set -euo pipefail
        mkdir -p build/release-evidence
        python3 - <<'PY'
        import json, os, pathlib, re, subprocess
        proxy=subprocess.check_output(['scutil','--proxy'],text=True)
        assert not re.search(r'(?:HTTPEnable|HTTPSEnable|SOCKSEnable|ProxyAutoConfigEnable|ProxyAutoDiscoveryEnable)\s*:\s*1\b',proxy), 'Proxy-enabled runner cannot prove production host isolation'
        assert not any(value for key,value in os.environ.items() if key.lower() in ('http_proxy','https_proxy','all_proxy')), 'Proxy environment must be disabled for native UI isolation'
        hosts=set(["quangtu.vn","www.quangtu.vn","quangtu.vercel.app","quangtu-web.quangtu-ansitoanthu.workers.dev"])
        assert {'quangtu.vn','quangtu-web.quangtu-ansitoanthu.workers.dev','quangtu.vercel.app'}.issubset(hosts), 'Expected native origins and legacy alias are missing'
        assert all(re.fullmatch(r'[a-z0-9.-]+',host) for host in hosts)
        backup=pathlib.Path(os.environ['RUNNER_TEMP'])/'tutam-native-qa-hosts.backup'
        assert not backup.exists(), 'Refusing to replace a previous hosts backup'
        original=pathlib.Path('/etc/hosts').read_bytes()
        backup.write_bytes(original)
        lines=[]
        for line in original.decode().splitlines():
            address,separator,comment=line.partition('#')
            parts=address.split()
            if len(parts)>1 and any(host.lower() in hosts for host in parts[1:]):
                aliases=[host for host in parts[1:] if host.lower() not in hosts]
                if aliases:
                    lines.append(parts[0]+'\t'+' '.join(aliases)+((' #'+comment) if separator else ''))
                elif separator:
                    lines.append('#'+comment)
            else:
                lines.append(line)
        lines.append('# Tu Tap native CI: production-host isolation, not full offline mode')
        for host in sorted(hosts):
            lines.extend(['127.0.0.1\t'+host,'::1\t'+host])
        subprocess.run(['sudo','tee','/etc/hosts'],input='\n'.join(lines)+'\n',text=True,check=True,stdout=subprocess.DEVNULL)
        pathlib.Path('build/release-evidence/production-hosts.json').write_text(json.dumps(sorted(hosts),indent=2))
        PY
        sudo dscacheutil -flushcache
        python3 - <<'PY'
        import ipaddress, json, os, pathlib, socket
        hosts=json.loads(pathlib.Path('build/release-evidence/production-hosts.json').read_text())
        proof={}
        for host in hosts:
            proof[host]={}
            for family,name in [(socket.AF_INET,'ipv4'),(socket.AF_INET6,'ipv6')]:
                addresses=sorted({entry[4][0] for entry in socket.getaddrinfo(host,443,family,socket.SOCK_STREAM)})
                assert addresses and all(ipaddress.ip_address(address).is_loopback for address in addresses), 'Production host still resolves externally: '+host
                proof[host][name]=addresses
        pathlib.Path('build/release-evidence/production-host-isolation.json').write_text(json.dumps({'scope':'production hosts only; not full offline','addresses':proof},indent=2))
        with open(os.environ['GITHUB_ENV'],'a') as output:
            output.write('TUTAM_QA_HOSTS_ISOLATED=1\n')
        PY
    - name: Select and boot an available iPhone simulator
      run: |
        set -euo pipefail
        test "$TUTAM_QA_HOSTS_ISOLATED" = 1
        xcrun simctl list devices available --json > build/release-evidence/simulator-devices.json
        simulator_id=$(python3 - <<'PY'
        import json, os
        data=json.load(open('build/release-evidence/simulator-devices.json'))
        sdk=os.environ['TUTAM_QA_SIMULATOR_SDK_VERSION']
        runtime='com.apple.CoreSimulator.SimRuntime.iOS-'+sdk.replace('.', '-')
        for device in data['devices'].get(runtime, []):
            if device.get('isAvailable') and device['name'].startswith('iPhone'):
                with open('build/release-evidence/simulator-selection.json','w') as evidence:
                    json.dump({'sdkVersion':sdk,'runtime':runtime,'device':device['name'],'udid':device['udid']},evidence)
                print(device['udid'])
                raise SystemExit(0)
        raise SystemExit(f'No available iPhone simulator matching the selected SDK {sdk}')
        PY
        )
        echo "TUTAM_QA_SIMULATOR=$simulator_id" >> "$GITHUB_ENV"
        # Keep software-keyboard prerequisites deterministic on this disposable CI runner.
        # Existing Simulator preference used by ProtonVPN/ios-app CI and Appium's simulator driver.
        defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
        TUTAM_KEYBOARD_SIMULATOR="$simulator_id" python3 - <<'PY'
        import json, os, plistlib, subprocess
        domain='com.apple.iphonesimulator'
        prefs=plistlib.loads(subprocess.check_output(['defaults','export',domain,'-']))
        devices=prefs.setdefault('DevicePreferences',{})
        assert isinstance(devices,dict), 'Unexpected Simulator device preferences'
        selected=devices.setdefault(os.environ['TUTAM_KEYBOARD_SIMULATOR'],{})
        assert isinstance(selected,dict), 'Unexpected selected-device preferences'
        previous=selected.get('ConnectHardwareKeyboard')
        prefs['ConnectHardwareKeyboard']=False
        selected['ConnectHardwareKeyboard']=False
        subprocess.run(['defaults','import',domain,'-'],input=plistlib.dumps(prefs),check=True)
        check=plistlib.loads(subprocess.check_output(['defaults','export',domain,'-']))
        assert check['ConnectHardwareKeyboard'] is False
        assert check['DevicePreferences'][os.environ['TUTAM_KEYBOARD_SIMULATOR']]['ConnectHardwareKeyboard'] is False
        with open('build/release-evidence/simulator-keyboard-preferences.json','w') as evidence:
            json.dump({'selectedDevicePrevious':previous,'globalHardwareKeyboard':False,'selectedDeviceHardwareKeyboard':False},evidence)
        PY
        if ! xcrun simctl list devices booted | grep -Fq "$simulator_id"; then
          xcrun simctl boot "$simulator_id"
        fi
        xcrun simctl bootstatus "$simulator_id" -b
    - name: Build native copying UI tests against frozen release assets
      timeout-minutes: 12
      run: |
        set -euo pipefail
        node --input-type=module <<'JS'
        import fs from 'node:fs'; import {createHash} from 'node:crypto';
        const sha=b=>createHash('sha256').update(b).digest('hex');
        if(sha(fs.readFileSync('ios/App/AppUITests/NativeGuestSmokeTests.swift'))!=='a6f3688253b72349c65176ce118d99c57b85b4ea5f660b80f326b129be2cb61d')throw Error('UI test source changed');
        JS
        xcodebuild -quiet -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
          -sdk iphonesimulator -destination "platform=iOS Simulator,id=$TUTAM_QA_SIMULATOR" \
          -derivedDataPath build/ios-simulator \
          -only-testing:AppUITests/NativeCopyingReferenceTests/testCopyingDiaTangReferenceTOCAndTypedGhost \
          -only-testing:AppUITests/NativeCopyingReferenceTests/testCopyingPhapHoaReferenceTOCAndTypedGhost \
          -only-testing:AppUITests/NativeCopyingReferenceTests/testCopyingLangNghiemReferenceTOCAndTypedGhost \
          -only-testing:AppUITests/NativeCopyingReferenceTests/testCopyingDuocSuReferenceFormattingAndTypedGhost \
          -only-testing:AppUITests/NativeExtendedGuestTests/testNativeScriptureCopyingReferenceAndGhost \
          -only-testing:AppUITests/NativeCopyingParagraphTests/testNativeCopyingPreservesEmptyParagraphsInDurableDraft \
          CODE_SIGNING_ALLOWED=NO build-for-testing
        node --input-type=module <<'JS'
        import fs from 'node:fs'; import path from 'node:path'; import {createHash} from 'node:crypto';
        const sha=b=>createHash('sha256').update(b).digest('hex');
        const root='build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app/public';
        const raw=fs.readFileSync(path.join(root,'mobile-assets-manifest.json'));
        if(sha(raw)!=='eb60adaaa3be0a690f993cc9bba0fa2403ddac97d385d04aebedf8bbbd86e0d6')throw Error('Simulator bundle differs from frozen release');
        for(const file of JSON.parse(raw).files){const data=fs.readFileSync(path.join(root,file.path));if(data.length!==file.bytes||sha(data)!==file.sha256)throw Error(file.path);}
        fs.writeFileSync('build/release-evidence/simulator-assets-proof.json',JSON.stringify({manifestSHA256:sha(raw),assets:JSON.parse(raw).files.length,commit:process.env.GITHUB_SHA,pass:true},null,2));
        JS
    - name: Require all six targeted native copying tests
      timeout-minutes: 40
      run: |
        set -uo pipefail
        # Collect every class in this one build even if an earlier class fails.
        set +e
        test "$TUTAM_QA_HOSTS_ISOLATED" = 1 || exit 1
        app='build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app'
        for suite in copying copying-paragraphs copying-smoke; do
          export IOS_TEST_SUITE="$suite"
          setup_status=0
          if xcrun simctl get_app_container "$TUTAM_QA_SIMULATOR" vn.quangtu.tutam data >/dev/null 2>&1; then
            xcrun simctl uninstall "$TUTAM_QA_SIMULATOR" vn.quangtu.tutam
            command_status=$?
            if [ "$command_status" -ne 0 ]; then setup_status=$command_status; fi
          fi
          xcrun simctl install "$TUTAM_QA_SIMULATOR" "$app"
          command_status=$?
          if [ "$command_status" -ne 0 ]; then setup_status=$command_status; fi
          testing_args=(-only-testing:AppUITests/NativeCopyingParagraphTests/testNativeCopyingPreservesEmptyParagraphsInDurableDraft)
          if [ "$suite" = copying ]; then
            testing_args=(
              -only-testing:AppUITests/NativeCopyingReferenceTests/testCopyingDiaTangReferenceTOCAndTypedGhost
              -only-testing:AppUITests/NativeCopyingReferenceTests/testCopyingPhapHoaReferenceTOCAndTypedGhost
              -only-testing:AppUITests/NativeCopyingReferenceTests/testCopyingLangNghiemReferenceTOCAndTypedGhost
              -only-testing:AppUITests/NativeCopyingReferenceTests/testCopyingDuocSuReferenceFormattingAndTypedGhost
            )
          elif [ "$suite" = copying-smoke ]; then
            testing_args=(-only-testing:AppUITests/NativeExtendedGuestTests/testNativeScriptureCopyingReferenceAndGhost)
          fi
          result="build/release-evidence/$suite.xcresult"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$TUTAM_QA_SIMULATOR" \
            -derivedDataPath build/ios-simulator -resultBundlePath "$result" \
            "${testing_args[@]}" -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "build/release-evidence/$suite.log"
          test_status=${PIPESTATUS[0]}
          summary_status=125
          if [ -d "$result" ]; then
            xcrun xcresulttool get test-results summary --path "$result" > "build/release-evidence/$suite-summary.json"
            summary_status=$?
          fi
          persistence_status=0
          if [ "$suite" = copying-paragraphs ]; then
            qa_app_data="$(xcrun simctl get_app_container "$TUTAM_QA_SIMULATOR" vn.quangtu.tutam data)"
            container_status=$?
            if [ "$container_status" -eq 0 ]; then
              python3 - "$qa_app_data" build/release-evidence/copying-paragraphs-persistence.json <<'PY'
        #!/usr/bin/env python3
        """Read only the owned guest fixture's two native draft slots; never seed or alter app data."""
        import hashlib
        import json
        import os
        from pathlib import Path
        import sys
        import time
        
        KEY = 'tt_copy_v1:guest:duoc-su:nfc-v1-7626225a5614e1f72158:1'
        VERSION = 'nfc-v1-7626225a5614e1f72158'
        EXPECTED = 'Nam\n\nmo Phat\n\n'
        KEY_HASH = hashlib.sha256(KEY.encode('utf-8')).hexdigest()
        EXPECTED_HASH = hashlib.sha256(EXPECTED.encode('utf-8')).hexdigest()
        
        def inspect(container):
            base = container / 'Documents' / 'scripture-copying'
            slots = []
            for slot in (0, 1):
                file = base / (KEY_HASH + '.' + str(slot) + '.json')
                if not file.is_file():
                    return None, 'missing_slot'
                raw = file.read_bytes()
                if len(raw) > 2_000_000:
                    return None, 'fixture_size'
                envelope = json.loads(raw.decode('utf-8'))
                sequence, payload = envelope.get('sequence'), envelope.get('payload')
                if type(sequence) is not int or not 0 <= sequence <= 9007199254740991 or sequence % 2 != slot or not isinstance(payload, str):
                    return None, 'envelope_schema'
                checksum = hashlib.sha256(payload.encode('utf-8')).hexdigest()
                if envelope.get('checksum') != checksum:
                    return None, 'checksum'
                draft = json.loads(payload)
                texts = draft.get('texts')
                if (draft.get('sutraId') != 'duoc-su' or draft.get('chapter') != 1 or draft.get('sourceVersion') != VERSION
                        or not isinstance(draft.get('runId'), str) or not isinstance(texts, list) or len(texts) != 28
                        or not all(isinstance(text, str) for text in texts)):
                    return None, 'draft_schema'
                slots.append((sequence, slot, draft, checksum, hashlib.sha256(raw).hexdigest()))
            slots.sort(key=lambda value: value[0], reverse=True)
            if slots[0][0] == slots[1][0]:
                return None, 'sequence_tie'
            sequence, slot, draft, checksum, file_hash = slots[0]
            texts = draft['texts']
            result = {
                'fixture': 'copying-paragraphs-guest-duoc-su', 'keySha256': KEY_HASH,
                'expectedTextSha256': EXPECTED_HASH, 'textSha256': hashlib.sha256(texts[0].encode('utf-8')).hexdigest(),
                'textCount': len(texts), 'firstTextCharacters': len(texts[0]), 'firstTextNewlines': texts[0].count('\n'),
                'otherNonemptyTexts': sum(text != '' for text in texts[1:]),
                'highestSequence': sequence, 'highestSlot': slot, 'sourceVersionMatches': draft['sourceVersion'] == VERSION,
                'slotProofs': [{'slot': value[1], 'sequence': value[0], 'checksumVerified': True, 'fileSha256': value[4]} for value in slots],
                'pass': texts[0] == EXPECTED and all(text == '' for text in texts[1:]) and draft.get('block') == 0,
            }
            return result, None if result['pass'] else 'raw_fixture_mismatch'
        
        def main():
            assert os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_OS') == 'macOS', 'owned CI only'
            assert os.environ.get('IOS_TEST_SUITE') == 'copying-paragraphs', 'exact profile only'
            assert len(sys.argv) == 3, 'container and evidence path required'
            container, output = Path(sys.argv[1]).resolve(), Path(sys.argv[2]).resolve()
            assert container.is_dir() and output.parent.name == 'release-evidence' and output.name == 'copying-paragraphs-persistence.json', 'owned paths required'
            deadline, attempts = time.monotonic() + 10.0, 0
            result, reason = None, 'not_ready'
            while True:
                attempts += 1
                try:
                    result, reason = inspect(container)
                except (OSError, ValueError, TypeError, AttributeError):
                    result, reason = None, 'incomplete_or_invalid_slot'
                if result and result['pass']:
                    break
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    break
                time.sleep(min(0.1, remaining))
            proof = result or {'fixture': 'copying-paragraphs-guest-duoc-su', 'keySha256': KEY_HASH,
                               'expectedTextSha256': EXPECTED_HASH, 'pass': False}
            proof.update(attempts=attempts, durableWaitLimitSeconds=10, reason=reason)
            output.write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
            print(json.dumps({'fixture': proof['fixture'], 'pass': proof['pass'], 'textCount': proof.get('textCount'),
                              'firstTextNewlines': proof.get('firstTextNewlines'), 'reason': reason}))
            return 0 if proof['pass'] else 1
        
        if __name__ == '__main__':
            raise SystemExit(main())
        PY
              persistence_status=$?
            else
              persistence_status=$container_status
            fi
          fi
          python3 - "$setup_status" "$test_status" "$summary_status" "$persistence_status" <<'PY'
        import json,os,pathlib,sys
        suite=os.environ['IOS_TEST_SUITE']
        row=dict(suite=suite,setupExitCode=int(sys.argv[1]),testExitCode=int(sys.argv[2]),summaryExitCode=int(sys.argv[3]),persistenceExitCode=int(sys.argv[4]))
        pathlib.Path('build/release-evidence/'+suite+'-execution.json').write_text(json.dumps(row,indent=2))
        print(json.dumps(row))
        PY
        done
        python3 - <<'PY'
        import json,os,pathlib
        out=pathlib.Path('build/release-evidence'); expected={'copying':4,'copying-paragraphs':1,'copying-smoke':1}
        errors=[]; results={}; passed=failed=skipped=0
        for suite,count in expected.items():
            entry={}; results[suite]=entry
            try:
                execution=json.loads((out/(suite+'-execution.json')).read_text());entry['execution']=execution
                for key in ['setupExitCode','testExitCode','summaryExitCode','persistenceExitCode']:
                    if execution.get(key)!=0: errors.append(suite+': '+key+'='+str(execution.get(key)))
            except Exception as error: errors.append(suite+': execution receipt missing/invalid: '+type(error).__name__)
            try:
                summary=json.loads((out/(suite+'-summary.json')).read_text()); entry['summary']=summary
                passed+=summary['passedTests']; failed+=summary['failedTests']; skipped+=summary['skippedTests']
                if summary['passedTests']!=count or summary['failedTests']!=0 or summary['skippedTests']!=0:
                    errors.append(suite+': expected '+str(count)+' pass, 0 fail, 0 skip')
            except Exception as error: errors.append(suite+': native summary missing/invalid: '+type(error).__name__)
        try:
            persistence=json.loads((out/'copying-paragraphs-persistence.json').read_text())
            if persistence.get('pass') is not True: errors.append('Durable paragraph fixture failed')
        except Exception as error: errors.append('Durable paragraph evidence missing/invalid: '+type(error).__name__)
        proof=dict(pass_=not errors,passedTests=passed,failedTests=failed,skippedTests=skipped,commit=os.environ['GITHUB_SHA'],classes=results,errors=errors,realDevice=False)
        proof['pass']=proof.pop('pass_')
        (out/'native-copying-gate.json').write_text(json.dumps(proof,indent=2))
        print(json.dumps({'pass':proof['pass'],'passedTests':passed,'failedTests':failed,'skippedTests':skipped,'errors':errors}))
        raise SystemExit(0 if proof['pass'] else 1)
        PY
        aggregate_status=$?
        exit "$aggregate_status"
    - name: Capture native copying simulator evidence
      if: always()
      run: |
        mkdir -p build/release-evidence
        if [ -n "${TUTAM_QA_SIMULATOR:-}" ]; then
          xcrun simctl io "$TUTAM_QA_SIMULATOR" screenshot build/release-evidence/native-copying-final.png || true
        fi
        for result in build/release-evidence/*.xcresult; do
          if [ -d "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path "${result%.xcresult}-attachments" || true
          fi
        done
    - name: Restore ephemeral runner hosts
      if: always()
      run: |
        set -euo pipefail
        backup="$RUNNER_TEMP/tutam-native-qa-hosts.backup"
        if [ -f "$backup" ]; then
          sudo cp "$backup" /etc/hosts
          sudo dscacheutil -flushcache
          cmp "$backup" /etc/hosts
        fi
    - name: Upload native copying gate evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-copying-audit-${{ github.run_id }}
        path: build/release-evidence/
        retention-days: 3
        if-no-files-found: error
